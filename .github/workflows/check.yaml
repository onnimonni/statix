{
  "jobs": {
    "check": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "cachix/install-nix-action@master",
          "with": {
            "extra_nix_config": "# Kept out of the flake: its nixConfig made every `nix run` ask about each setting\nabort-on-warn = true\nallow-import-from-derivation = false\nextra-substituters = https://onnimonni.cachix.org\nextra-trusted-public-keys = onnimonni.cachix.org-1:bAPuRbTAiFMLNLoojt7KlqhQcpdeTN/OMIL22fP3LyM=\nkeep-env-derivations = true\nkeep-outputs = true\n",
            "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "uses": "nix-community/cache-nix-action@main",
          "with": {
            "primary-key": "nix-${{ runner.os }}"
          }
        },
        {
          "run": "nix flake check --print-build-logs"
        }
      ]
    }
  },
  "name": "Check",
  "on": {
    "pull_request": {},
    "push": {},
    "workflow_dispatch": {}
  }
}
