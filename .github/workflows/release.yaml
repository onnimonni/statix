{
  "jobs": {
    "binaries": {
      "if": "startsWith(github.ref, 'refs/tags/v')",
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "${{ matrix.target }}"
          }
        },
        {
          "if": "runner.os == 'Linux'",
          "run": "sudo apt-get update && sudo apt-get install -y musl-tools"
        },
        {
          "run": "cargo build --release --locked --bin statix --target ${{ matrix.target }}\ntar -czf statix-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release statix\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "statix-${{ matrix.target }}",
            "path": "statix-${{ matrix.target }}.tar.gz"
          }
        }
      ],
      "strategy": {
        "matrix": {
          "include": [
            {
              "os": "ubuntu-latest",
              "target": "x86_64-unknown-linux-musl"
            },
            {
              "os": "ubuntu-24.04-arm",
              "target": "aarch64-unknown-linux-musl"
            },
            {
              "os": "macos-latest",
              "target": "aarch64-apple-darwin"
            },
            {
              "os": "macos-latest",
              "target": "x86_64-apple-darwin"
            }
          ]
        }
      }
    },
    "cachix": {
      "if": "${{ vars.CACHIX_CACHE != '' }}",
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "cachix/install-nix-action@master"
        },
        {
          "uses": "cachix/cachix-action@master",
          "with": {
            "authToken": "${{ secrets.CACHIX_AUTH_TOKEN }}",
            "name": "${{ vars.CACHIX_CACHE }}"
          }
        },
        {
          "run": "nix build --accept-flake-config --print-build-logs .#statix .#statix-scripts"
        }
      ],
      "strategy": {
        "matrix": {
          "os": [
            "ubuntu-latest",
            "ubuntu-24.04-arm",
            "macos-latest"
          ]
        }
      }
    },
    "prebuilt-hashes": {
      "needs": "release",
      "permissions": {
        "contents": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5",
          "with": {
            "ref": "${{ github.event.repository.default_branch }}"
          }
        },
        {
          "env": {
            "BRANCH": "${{ github.event.repository.default_branch }}",
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh release download \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\" -p SHA256SUMS -D \"$RUNNER_TEMP\"\nwhile read -r hex file; do\n  target=${file#statix-}\n  printf '%s\\t%s\\n' \"${target%.tar.gz}\" \"sha256-$(printf '%s' \"$hex\" | xxd -r -p | base64)\"\ndone < \"$RUNNER_TEMP/SHA256SUMS\" \\\n  | jq -Rn --arg version \"${GITHUB_REF_NAME#v}\" \\\n    '{version: $version, hashes: ([inputs | split(\"\\t\") | {key: .[0], value: .[1]}] | from_entries)}' \\\n  > flake-parts/prebuilt.json\ngit diff --quiet && exit 0\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit commit -am \"chore: prebuilt binaries for $GITHUB_REF_NAME\"\ngit pull --rebase origin \"$BRANCH\"\ngit push origin \"HEAD:$BRANCH\"\n"
        }
      ]
    },
    "release": {
      "needs": "binaries",
      "permissions": {
        "contents": "write"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "merge-multiple": true
          }
        },
        {
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "sha256sum statix-*.tar.gz > SHA256SUMS\ngh release create \"$GITHUB_REF_NAME\" --repo \"$GITHUB_REPOSITORY\" --generate-notes statix-*.tar.gz SHA256SUMS\n"
        }
      ]
    }
  },
  "name": "Release",
  "on": {
    "push": {
      "branches": [
        "devenv"
      ],
      "tags": [
        "v*"
      ]
    },
    "workflow_dispatch": {}
  }
}
